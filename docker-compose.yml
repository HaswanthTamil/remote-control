services:
  relay:
    build:
      context: ./relay-server
    image: remote-control-relay:latest
    container_name: remote-control-relay
    ports:
      - "3000:3000"
    volumes:
      - relay-keys:/data
    # PAIR_TOKEN (+ optional heartbeat tuning) comes from relay-server/.env
    # (dev copy). Production: set PAIR_TOKEN as an env var instead, e.g.
    #   docker compose run --rm -e PAIR_TOKEN=... relay
    env_file:
      - ./relay-server/.env
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

volumes:
  relay-keys: