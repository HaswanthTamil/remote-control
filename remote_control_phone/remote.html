<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <title>Remote Desktop</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main class="remote-page">
    <header class="topbar remote-topbar">
      <a class="back" href="index.html" aria-label="Back">←</a>
      <div class="connection" id="connStatus">
        <span class="status-dot" id="connDot"></span>
        <span id="connText">Connect</span>
      </div>
      <button class="capture-toggle" id="captureToggle" title="Start/stop capture">▶</button>
    </header>

    <section class="screen-stage" id="screenStage" aria-label="Laptop screen">
      <canvas id="screenCanvas"></canvas>
      <div class="screen-hint" id="screenHint">Start capture to see the laptop screen</div>
      <div class="screen-badge" id="screenBadge" hidden>—×—</div>
    </section>

    <section class="control-bar" aria-label="Pointer controls">
      <div class="btn-row">
        <button class="key-chip" data-click="left" title="Left click">Left</button>
        <button class="key-chip" data-click="right" title="Right click">Right</button>
        <button class="key-chip" data-click="middle" title="Middle click">Mid</button>
      </div>
      <div class="touchpad-hint">
        Move: drag on screen · tap = left click · hold &amp; drag = drag · two-finger swipe = scroll
      </div>
    </section>

    <form class="combo-bar" id="comboForm">
      <input id="comboInput" type="text" autocomplete="off" autocapitalize="none"
             spellcheck="false" placeholder="Type text or keys (CTRL+ALT+T, SUPER+ENTER)"
             aria-label="Type text or key combo">
      <button type="submit">Send</button>
    </form>
  </main>

  <script type="module" src="js/remote.js"></script>
</body>
</html>
