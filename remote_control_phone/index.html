<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <title>Remote Control</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main class="home">
    <header class="topbar">
      <div>
        <div class="eyebrow">REMOTE CONTROL</div>
        <h1>Home</h1>
      </div>
      <div class="status-dot" title="Interface ready"></div>
    </header>

    <section class="app-drawer" aria-label="Apps">
      <a class="app-icon" href="remote.html">
        <span class="icon remote-icon" aria-hidden="true"><span>▣</span></span>
        <span class="app-name">Remote</span>
      </a>
      <a class="app-icon" href="terminal.html">
        <span class="icon terminal-icon" aria-hidden="true"><span>$_</span></span>
        <span class="app-name">Terminal</span>
      </a>
    </section>
  </main>

  <div class="lock-screen" id="lockScreen">
    <div class="lock-card">
      <span class="lock-mark" aria-hidden="true">&#128274;</span>
      <h1>Locked</h1>
      <p>Enter the passcode to open Remote Control</p>
      <form id="lockForm">
        <input id="lockPin" type="password" autocomplete="off" maxlength="10"
               placeholder="Passcode" aria-label="Passcode">
        <button type="submit">Unlock</button>
      </form>
      <div class="lock-error" id="lockError"></div>
    </div>
  </div>

  <script>
    (function () {
      var PASSCODE = "laser";
      var lock = document.getElementById("lockScreen");
      var form = document.getElementById("lockForm");
      var pin = document.getElementById("lockPin");
      var err = document.getElementById("lockError");

      function unlock() {
        try { sessionStorage.setItem("rc_unlocked", "1"); } catch (e) {}
        lock.classList.add("hidden");
        pin.value = "";
        err.textContent = "";
      }

      if (sessionStorage.getItem("rc_unlocked") === "1") {
        lock.classList.add("hidden");
      }

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        if (pin.value === PASSCODE) {
          unlock();
        } else {
          err.textContent = "Wrong passcode";
          pin.value = "";
          pin.focus();
        }
      });
    })();
  </script>
</body>
</html>
