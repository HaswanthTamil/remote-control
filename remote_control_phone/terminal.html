<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <title>Terminal</title>
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Passcode gate: keep this tab locked until index.html unlocks it.
    if (sessionStorage.getItem("rc_unlocked") !== "1") {
      location.replace("index.html");
    }
  </script>
</head>
<body>
  <main class="terminal-page">
    <header class="topbar terminal-topbar">
      <a class="back" href="index.html" aria-label="Back">←</a>
      <div class="connection">
        <span class="status-dot"></span>
        <span>Ready</span>
      </div>
    </header>

    <section class="terminal" aria-label="Terminal output">
      <div class="terminal-line muted">Remote Linux shell</div>
      <div class="terminal-line">
        <span class="prompt">$</span><span>Ready.</span>
      </div>
    </section>

    <form class="command-bar" id="commandForm">
      <span class="prompt">$</span>
      <input id="commandInput" type="text" autocomplete="off" autocapitalize="none"
             spellcheck="false" placeholder="Type a command…" aria-label="Command">
      <button type="submit">Run</button>
    </form>
  </main>

  <script type="module" src="js/terminal.js"></script>
</body>
</html>
